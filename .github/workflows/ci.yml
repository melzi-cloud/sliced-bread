name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet (including e2e build tag)
        run: go vet ./... && go vet -tags e2e ./...
      - name: unit tests
        run: go test -count=1 ./...
      - name: secret scan
        run: hack/scan-secrets
